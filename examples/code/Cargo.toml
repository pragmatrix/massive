[package]
name = "code"
version = "0.1.0"
edition.workspace = true

[dev-dependencies]

shared = { path = "../shared" }

massive-applications = { workspace = true }
massive-geometry = { workspace = true }
massive-scene = { workspace = true }
massive-shapes = { workspace = true }
massive-shell = { workspace = true }

postcard = { workspace = true }
anyhow = { workspace = true }
winit = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }

tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tracing-flame = { workspace = true }
tracing-chrome = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]

load-cargo = { path = "rust-analyzer/crates/load-cargo" }
project-model = { path = "rust-analyzer/crates/project-model" }
vfs = { path = "rust-analyzer/crates/vfs" }
base-db = { path = "rust-analyzer/crates/base-db" }
syntax = { path = "rust-analyzer/crates/syntax" }
# Semantics
hir = { path = "rust-analyzer/crates/hir" }
# Syntax highlighting, AnalysisHost
ide = { path = "rust-analyzer/crates/ide" }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]

console_error_panic_hook = "0.1.7"
console_log = "1.0.0"
wasm-bindgen-futures = { workspace = true }

# ra-ap-rustc_lexer, reached through the vendored rust-analyzer crates, rejects a
# unicode-ident whose Unicode tables differ from unicode-properties'. Both crates
# moved to Unicode 18 in later releases (unicode-ident 1.0.25, unicode-properties
# 0.1.5), so both stay pinned at their last Unicode 17 releases, and a release of
# either cannot break the pair.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
unicode-ident = "=1.0.24"
unicode-properties = "=0.1.4"

[lints]
workspace = true
